name: Loss Analysis (trades vs 5-min candles)

on:
  workflow_dispatch:
    inputs:
      trades:
        description: "Space-separated trades CSV paths (trades_best.csv)"
        required: true

permissions:
  contents: write

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy tabulate
      - name: Restore cached candle data
        uses: actions/cache/restore@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}
          restore-keys: research-data-
      - name: Analyse
        run: |
          for T in ${{ inputs.trades }}; do
            python mtf_roadmap/loss_analysis.py --trades "$T" --data-dir research_data/raw/5m --out "$(dirname $T)/loss_analysis"
            cat "$(dirname $T)/loss_analysis/summary.md" >> $GITHUB_STEP_SUMMARY
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research_results/
          git commit -m "Loss analysis [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
