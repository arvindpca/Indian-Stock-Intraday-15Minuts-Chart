name: Reliance Data Download (Angel One)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "reliance_strategy/download_data.py"
      - ".github/workflows/reliance-data.yml"

permissions:
  contents: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Download Reliance + Nifty 5m/15m
        run: python reliance_strategy/download_data.py
      - name: Run final strategy backtest on fresh data
        run: pip install tabulate && python reliance_strategy/final_strategy.py && python reliance_strategy/final_strategy.py --signal-today
      - name: Save data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f reliance_strategy/data reliance_strategy/results
          git commit -m "Reliance + Nifty candle data [skip ci]" || exit 0
          git pull --rebase origin main && git push
