name: Paper Swing Trader (daily, after market)

on:
  schedule:
    # 16:37 IST (market band hone ke baad) + 18:37 IST retry. Mon-Fri. Same din dobara process nahi hota.
    - cron: "7 11 * * 1-5"
    - cron: "7 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-swing
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install yfinance pandas numpy requests
      - name: Run paper trader
        shell: bash
        run: python paper_swing/paper_trader.py 2>&1 | grep -v "^  downloading"
      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_swing/state
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Paper swing update $(TZ=Asia/Kolkata date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
      - name: Summary
        if: always()
        run: |
          [ -f paper_swing/state/STATUS.md ] && cat paper_swing/state/STATUS.md >> "$GITHUB_STEP_SUMMARY" || true
