name: Reliance Intraday Strategy Test (1 year, Angel One)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reliance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt tabulate
      - name: Download 1Y 15-min data + test 6 strategies
        run: python reliance_strategy/reliance_intraday_backtest.py
      - name: Write job summary
        if: always()
        run: |
          if [ -f reliance_strategy/results/summary.md ]; then
            cat reliance_strategy/results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliance-strategy-results
          path: reliance_strategy/results/
          if-no-files-found: ignore
