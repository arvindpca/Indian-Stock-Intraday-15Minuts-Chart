name: Publish backtest report

on:
  push:
    branches: [backtest-report]

permissions:
  contents: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Reuse candles from the 180-day run
        uses: actions/download-artifact@v4
        with:
          name: v1-smc-5m-backtest-180d
          path: data/
          run-id: 40114904404
          github-token: ${{ github.token }}
      - name: Run backtest
        run: python backtest_v1_smc_5m.py
      - name: Run add/remove variants
        run: python backtest_variants.py
      - name: Condition on/off tests
        run: python backtest_conditions.py
      - name: Best setup month-wise
        run: python backtest_best.py
      - name: SL / TP / trailing grid
        run: python backtest_sl_tp.py
      - name: Download NIFTY 50 candles
        run: python download_nifty.py
      - name: Nifty trend / volume / POC filter test
        run: python backtest_nifty.py
      - name: LONG + SHORT improvements stacked
        run: python backtest_both_sides.py
      - name: Push report to backtest-results branch
        run: |
          mkdir -p /tmp/out && cp data/backtest/* /tmp/out/
          cp data/angel_5m_download_summary.json data/angel_5m_download_report.csv /tmp/out/ 2>/dev/null || true
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan backtest-results && git rm -rqf . && rm -rf data
          cp /tmp/out/* . && git add -A && git commit -qm "180-day backtest report"
          git push -f origin backtest-results
