name: NSE Intraday Research Pipeline (174 stocks)

# Manual run only. Data is cached between runs (resumable download), results are
# uploaded as an artifact AND committed to research_results/ (small CSV/JSON only).
on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "0 = all symbols in stock_names.txt (use 10 for a quick test)"
        default: "0"
      download_budget_min:
        description: "Stop downloading after N minutes (rest resumes next run)"
        default: "240"

permissions:
  contents: write

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt -r research/requirements.txt

      - name: Restore cached candle data
        uses: actions/cache/restore@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}
          restore-keys: research-data-

      - name: Automated tests (lookahead, execution, costs, SL/TP, overlap, metrics)
        run: |
          mkdir -p research_results
          python -m unittest discover -s research/tests -t . -v 2>&1 | tee research_results/test_report_latest.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Download / update 5-min data from Angel One (resumable)
        run: python research/data_download.py --max-symbols ${{ inputs.max_symbols }} --time-budget-min ${{ inputs.download_budget_min }}

      - name: Save candle data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}

      - name: Run research (quality -> features -> discovery -> validation -> walk-forward -> OOS)
        run: |
          RUN_DIR=research_results/run_$(date +%Y-%m-%d_%H%M)
          echo "RUN_DIR=$RUN_DIR" >> $GITHUB_ENV
          if [ "${{ inputs.max_symbols }}" != "0" ]; then
            SYMS=$(head -n ${{ inputs.max_symbols }} stock_names.txt | tr -d '\r' | paste -sd, -)
            python research/run_research.py --out "$RUN_DIR" --symbols "$SYMS"
          else
            python research/run_research.py --out "$RUN_DIR"
          fi
          cp research_results/test_report_latest.txt "$RUN_DIR/test_report.txt"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results-${{ github.run_id }}
          path: research_results/
          retention-days: 30

      - name: Commit results to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research_results/
          git commit -m "Research results ${RUN_DIR} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
