name: Sector Pullback Strategy Backtest

# Manual run. Uses the 5-min candles cached by the research pipeline; for an index
# universe the missing stocks are downloaded once from Angel One and cached.
on:
  workflow_dispatch:
    inputs:
      universe:
        description: "stock_names = 174 repo stocks | nifty500 / midcap100 / nifty100 = trade only NON-F&O stocks of that index"
        default: "nifty500"
      sector_source:
        description: "median = sector strength from its stocks | index = NSE sector index | both"
        default: "both"
      trade_file:
        description: "Optional: trade ONLY the stocks in this file (e.g. sector_pullback/nifty500_selected182.txt)"
        default: ""

permissions:
  contents: write

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt -r research/requirements.txt tabulate

      - name: Restore cached candle data
        uses: actions/cache/restore@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}
          restore-keys: research-data-

      - name: Build sector map from NSE lists
        run: python sector_pullback/build_sector_map.py

      - name: Build index universe (all members + non-F&O list)
        if: inputs.universe != 'stock_names'
        run: python sector_pullback/build_universe.py --index ${{ inputs.universe }}

      - name: Download missing index stocks (cached ones are skipped)
        if: inputs.universe != 'stock_names'
        run: |
          cp research/config.yaml /tmp/config.yaml.bak
          sed -i "s#^universe_file:.*#universe_file: sector_pullback/${{ inputs.universe }}.txt#" research/config.yaml
          python research/data_download.py --time-budget-min 220
          cp /tmp/config.yaml.bak research/config.yaml

      - name: Download NSE sector indices (5-min, 2y)
        if: inputs.sector_source != 'median'
        run: python sector_pullback/sector_index_download.py

      - name: Save candle data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}

      - name: Backtest
        run: |
          U=${{ inputs.universe }}
          OUT=research_results/sector_pullback/run_${U}_$(date +%Y-%m-%d_%H%M)
          echo "OUT=$OUT" >> $GITHUB_ENV
          if [ "$U" = "stock_names" ]; then
            ARGS="--symbols-file stock_names.txt"
          else
            ARGS="--symbols-file sector_pullback/$U.txt --trade-symbols-file sector_pullback/${U}_nonfno.txt"
          fi
          if [ -n "${{ inputs.trade_file }}" ]; then
            ARGS="--symbols-file sector_pullback/$U.txt --trade-symbols-file ${{ inputs.trade_file }}"
            OUT=${OUT}_$(basename ${{ inputs.trade_file }} .txt); echo "OUT=$OUT" >> $GITHUB_ENV
          fi
          SRC=${{ inputs.sector_source }}
          [ "$SRC" = "both" ] && SRCS="median index" || SRCS="$SRC"
          for S in $SRCS; do
            python sector_pullback/backtest.py --data-dir research_data/raw/5m $ARGS \
              --sector-source $S --out "$OUT/$S"
            cat "$OUT/$S/summary.md" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-pullback-${{ github.run_id }}
          path: |
            research_results/sector_pullback/
            sector_pullback/*.csv
            sector_pullback/*.txt
          retention-days: 30

      - name: Commit results to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research_results/sector_pullback/ sector_pullback/*.csv sector_pullback/*.txt
          git commit -m "Sector pullback backtest ${OUT} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
