name: MTF Roadmap Backtest (1D -> 4H -> 15M, or intraday version)

# Manual run. Uses cached 5-min candles (no Angel login needed).
on:
  workflow_dispatch:
    inputs:
      symbols_file:
        description: "Stocks to trade"
        default: "sector_pullback/nifty500_selected182.txt"
      version:
        description: "intraday = 1D trend -> intraday levels -> 5m sweep+MSS | swing = 1D -> 4H -> 15M"
        default: "intraday"

permissions:
  contents: write

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy tabulate
      - name: Restore cached candle data
        uses: actions/cache/restore@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}
          restore-keys: research-data-
      - name: Backtest
        run: |
          V=${{ inputs.version }}
          OUT=research_results/mtf_roadmap/run_${V}_$(basename ${{ inputs.symbols_file }} .txt)_$(date +%Y-%m-%d_%H%M)
          echo "OUT=$OUT" >> $GITHUB_ENV
          [ "$V" = "intraday" ] && SCRIPT=mtf_roadmap/intraday.py || SCRIPT=mtf_roadmap/backtest.py
          python $SCRIPT --data-dir research_data/raw/5m \
            --symbols-file ${{ inputs.symbols_file }} --out "$OUT"
          cat "$OUT/summary.md" >> $GITHUB_STEP_SUMMARY
      - name: Commit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research_results/mtf_roadmap/
          git commit -m "MTF roadmap backtest ${OUT} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
