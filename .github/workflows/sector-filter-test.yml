name: Sector Pullback - filter / regime tests

on:
  workflow_dispatch:
    inputs:
      script:
        description: "filter_test, regime_test, more_trades_test universe_test, loss_analysis, fix_test, fixed_test, daily_test, extra_test, scan_test, scan_loss, scan_fix_test or indicator_test"
        default: "regime_test"
      only_combo:
        description: "more_trades_test: 1 = only the short combo list"
        default: "0"

permissions:
  contents: write

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy tabulate
      - name: Restore cached candle data
        uses: actions/cache/restore@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}
          restore-keys: research-data-
      - name: Test
        env:
          ONLY_COMBO: ${{ inputs.only_combo }}
        run: |
          OUT=research_results/sector_pullback/${{ inputs.script }}_$(date +%Y-%m-%d_%H%M)
          if [ "${{ inputs.script }}" = "loss_analysis" ]; then
            T=$(ls -d research_results/sector_pullback/universe_test_* | tail -1)/trades.csv
            python sector_pullback/loss_analysis.py --trades "$T" --universe "All non-F&O" \
              --data-dir research_data/raw/5m --out "$OUT"
          elif [ "${{ inputs.script }}" = "universe_test" ] || [ "${{ inputs.script }}" = "fix_test" ] || [ "${{ inputs.script }}" = "fixed_test" ] || [ "${{ inputs.script }}" = "daily_test" ] || [ "${{ inputs.script }}" = "extra_test" ] || [ "${{ inputs.script }}" = "scan_test" ] || [ "${{ inputs.script }}" = "scan_loss" ] || [ "${{ inputs.script }}" = "scan_fix_test" ] || [ "${{ inputs.script }}" = "indicator_test" ]; then
            python sector_pullback/${{ inputs.script }}.py --data-dir research_data/raw/5m --out "$OUT"
          else
          python sector_pullback/${{ inputs.script }}.py --data-dir research_data/raw/5m \
            --symbols-file sector_pullback/nifty500.txt \
            --trade-symbols-file sector_pullback/nifty500_selected182.txt --out "$OUT"
          fi
          cat "$OUT/summary.md" >> $GITHUB_STEP_SUMMARY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research_results/sector_pullback/
          git commit -m "Sector filter test [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
