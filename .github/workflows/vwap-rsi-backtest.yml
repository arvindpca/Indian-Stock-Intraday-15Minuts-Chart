name: VWAP + RSI Backtest (saved 5-min data)

# Manual run. Re-uses the 5-min candles already cached by the research pipeline,
# downloads only the missing Nifty 50 stocks from Angel One (once), saves them
# back to the same cache, then backtests vwap_rsi/vwap_rsi_algo.py rules.
on:
  workflow_dispatch:
    inputs:
      universe:
        description: "nifty50 = Nifty 50 stocks | all = 174 stocks in stock_names.txt"
        default: "nifty50"
      days:
        description: "Backtest only the last N trading days (0 = full 2 years)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: research-pipeline        # same group as the research pipeline: never touch the cache together
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_ID: ${{ secrets.ANGEL_CLIENT_ID }}
      ANGEL_PASSWORD: ${{ secrets.ANGEL_PASSWORD }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt -r research/requirements.txt

      - name: Restore cached candle data
        uses: actions/cache/restore@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}
          restore-keys: research-data-

      - name: Download missing Nifty 50 stocks (cached ones are skipped)
        if: inputs.universe == 'nifty50'
        run: |
          cp research/config.yaml /tmp/config.yaml.bak
          sed -i 's#^universe_file:.*#universe_file: vwap_rsi/nifty50.txt#' research/config.yaml
          python research/data_download.py --time-budget-min 60
          cp /tmp/config.yaml.bak research/config.yaml

      - name: Save candle data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: research_data
          key: research-data-${{ github.run_id }}

      - name: Backtest
        run: |
          OUT=research_results/vwap_rsi/run_${{ inputs.universe }}_${{ inputs.days }}d_$(date +%Y-%m-%d_%H%M)
          echo "OUT=$OUT" >> $GITHUB_ENV
          mkdir -p "$OUT"
          if [ "${{ inputs.universe }}" = "all" ]; then UNI="--symbols-file ../stock_names.txt"; else UNI="--nifty50-only"; fi
          ARGS="--data-dir ../research_data/raw/5m $UNI --days ${{ inputs.days }}"
          echo "universe=${{ inputs.universe }} days=${{ inputs.days }}" > "$OUT/params.txt"
          cd vwap_rsi
          python vwap_rsi_backtest.py $ARGS \
            --out "../$OUT/trades_filter.csv" | tee "../$OUT/summary_filter.txt"
          python vwap_rsi_backtest.py $ARGS --no-filter \
            --out "../$OUT/trades_nofilter.csv" | tee "../$OUT/summary_nofilter.txt"
          cat "../$OUT/summary_filter.txt" "../$OUT/summary_nofilter.txt" >> $GITHUB_STEP_SUMMARY

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vwap-rsi-backtest-${{ github.run_id }}
          path: research_results/vwap_rsi/
          retention-days: 30

      - name: Commit results to repo
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add research_results/vwap_rsi/
          git commit -m "VWAP+RSI backtest ${OUT} [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
